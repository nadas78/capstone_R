name: Deploy Quarto Website - NO JEKYLL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      JEKYLL_ENV: "disabled"
      DISABLE_JEKYLL: "true"

    steps:
      # =============================
      # 1. Checkout
      # =============================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =============================
      # 2. Clean previous build
      # =============================
      - name: Clean previous build
        run: |
          rm -rf docs/ _site/ .quarto-cache/ _freeze/

      # =============================
      # 3. Setup Quarto
      # =============================
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # =============================
      # 4. Setup Python (Jupyter)
      # =============================
      - name: Setup Python & Jupyter
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jupyter nbformat ipykernel jupyter-cache

      # =============================
      # 5. Setup R
      # =============================
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      # =============================
      # 6. Install R packages
      # =============================
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            rmarkdown
            knitr
            dplyr
            ggplot2
            tidyr
            readxl
            lubridate
            car
            lmtest
            gplots

      # =============================
      # 7. TinyTeX (SAFE – Quarto managed)
      # =============================
      - name: Install TinyTeX
        run: |
          quarto install tinytex
          pdflatex --version

      # =============================
      # 8. Render Quarto
      # =============================
      - name: Render Quarto website
        run: |
          quarto render

      # =============================
      # 9. Disable Jekyll
      # =============================
      - name: Disable Jekyll
        run: |
          touch docs/.nojekyll

      # =============================
      # 10. Deploy GitHub Pages
      # =============================
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
