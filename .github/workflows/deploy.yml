name: Deploy Quarto Website - NO JEKYLL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      JEKYLL_ENV: "disabled"
      DISABLE_JEKYLL: "true"

    steps:
      # =============================
      # 1. Checkout
      # =============================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =============================
      # 2. Nettoyage
      # =============================
      - name: Clean previous build
        run: |
          echo "🗑️ Nettoyage..."
          rm -rf docs/ _site/ .quarto-cache/ _freeze/
          echo "✅ OK"

      # =============================
      # 3. Setup Quarto
      # =============================
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # =============================
      # 4. Python + Jupyter (WebR / notebooks)
      # =============================
      - name: Setup Python & Jupyter
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jupyter nbformat ipykernel jupyter-cache

      # =============================
      # 5. Setup R
      # =============================
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      # =============================
      # 6. Install R packages (PRO)
      # =============================
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            rmarkdown
            knitr
            dplyr
            ggplot2
            tidyr
            readxl
            lubridate
            car
            lmtest
            gplots
          cache-version: 1

      # =============================
      # 7. TinyTeX (LaTeX)
      # =============================
      - name: Cache TinyTeX
        uses: actions/cache@v3
        with:
          path: ~/.TinyTeX
          key: ${{ runner.os }}-tinytex

      - name: Install TinyTeX
        run: |
          if [ ! -d "$HOME/.TinyTeX" ]; then
            echo "📄 Installation TinyTeX..."
            wget -qO- https://yihui.org/tinytex/install-unx.sh | sh
          fi

          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> $GITHUB_PATH
          tlmgr update --self
          tlmgr install scheme-basic amsmath amsfonts amssymb booktabs geometry hyperref xcolor

          pdflatex --version
          echo "✅ TinyTeX prêt"

      # =============================
      # 8. Render Quarto
      # =============================
      - name: Render Quarto website
        run: |
          echo "🚀 Rendu Quarto..."
          quarto render
          echo "✅ Rendu terminé"

      # =============================
      # 9. Kill Jekyll définitivement
      # =============================
      - name: Disable Jekyll
        run: |
          touch docs/.nojekyll
          echo "🛑 Jekyll désactivé"

      # =============================
      # 10. Deploy GitHub Pages
      # =============================
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false
